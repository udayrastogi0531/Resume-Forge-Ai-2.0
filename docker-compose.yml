services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: resumeforge
      POSTGRES_PASSWORD: resumeforge
      POSTGRES_DB: resumeforge
    volumes: [pgdata:/var/lib/postgresql/data]
  api:
    build: ./apps/api
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg2://resumeforge:resumeforge@postgres:5432/resumeforge
      CORS_ORIGINS: http://localhost:3000
    ports: ["8000:8000"]
    depends_on: [postgres]
  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  pgdata:
